[project]
name = "route-catalog-lab"
version = "0.1.0"
description = "Каталог туристичних маршрутів вихідного дня: HTTP-сервіс із контрольованою AI-функцією (Лабораторна робота 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
